<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manga Türkçe Overlay</title><style>body{font:14px system-ui;margin:14px;width:280px;color:#172033}label{display:block;font-size:12px;font-weight:700;margin-top:12px}input{box-sizing:border-box;width:100%;padding:9px;margin-top:5px;border:1px solid #ccd1dc;border-radius:8px}button{width:100%;padding:10px;margin-top:8px;border:0;border-radius:8px;background:#5b37e8;color:white;font-weight:700;cursor:pointer}button:disabled{opacity:.48;cursor:not-allowed}button.secondary{background:#e7e9ee;color:#172033}p{line-height:1.4;color:#556070}#status{min-height:20px;overflow-wrap:anywhere}#build{margin-top:12px;font-size:11px;color:#8a93a5;user-select:text}#stats{margin-top:10px;padding:8px 10px;border:1px solid #e7e9ee;border-radius:8px;font-size:12px;line-height:1.5;color:#556070}#stats strong{color:#172033}#stats .err{color:#b3261e}#stats:empty{display:none}#complete{font-weight:700;min-height:1.2em}#complete.ok{color:#1f7a3a}#complete.cancel{color:#8a93a5}#complete.hide{display:none}</style></head><body><strong>Manga Türkçe Overlay</strong><p>Yerel OCR ile okur, DeepL üzerinden Türkçeye çevirir.</p><label for="deepl-key">DeepL API anahtarı</label><input id="deepl-key" type="password" autocomplete="off" placeholder="••••••••••••••••:fx"><button id="save-key" class="secondary">Anahtarı kaydet ve test et</button><button id="start" disabled>Tüm görselleri işle</button><button class="secondary" id="clear">Overlay'i kapat</button><p id="status" role="status"></p><div id="stats" role="status"></div><p id="complete" class="hide" role="status" aria-live="polite"></p><p id="build" role="note" title="Yüklü build kimliği — dist/chromium/build-info.json ile karşılaştırın"></p><script src="popup.js"></script></body></html>
